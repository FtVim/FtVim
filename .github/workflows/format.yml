name: format

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "lua/**"
      - "tests/**"
      - ".stylua.toml"
      - ".github/workflows/format.yml"

jobs:
  stylua-check:
    name: "Formatting check with Stylua"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # CLI arguments
          version: 2.5.2
          args: --check .
